function getUnitBadge(name) {
    if (name.toLowerCase().includes('exercise')) {
        return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-100 text-green-700 uppercase whitespace-nowrap flex-shrink-0">Exercise</span>';
    }
    if (name.toLowerCase().includes('assessment') || name.toLowerCase().includes('check')) {
        return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-700 uppercase whitespace-nowrap flex-shrink-0">Quiz</span>';
    }
    return '';
}

function renderModules(filterText = '') {
        moduleGrid.innerHTML = '';
        const filtered = courseData.filter(m => 
            m.title.toLowerCase().includes(filterText.toLowerCase()) || 
            m.units.some(u => u.name.toLowerCase().includes(filterText.toLowerCase()))
        );

        moduleCount.innerText = filtered.length;

        filtered.forEach(module => {
        const card = document.createElement('div');
        card.className = 'module-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col';
        
        let unitsHtml = module.units.map(unit => `
            <li>
                <a href="${unit.url}" target="_blank" class="unit-link flex items-center justify-between px-4 py-3 md:py-2.5 text-sm text-slate-600 border-b border-slate-50 last:border-0 transition-colors gap-2">
                    <span class="flex-1 min-w-0 break-words">${unit.name}</span>
                    <div class="flex items-center flex-shrink-0">
                        ${getUnitBadge(unit.name)}
                        <i class="fas fa-chevron-right text-[10px] text-slate-300 ml-2"></i>
                    </div>
                </a>
            </li>
        `).join('');

        card.innerHTML = `
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 md:p-5">
                <div class="flex items-start justify-between gap-3">
                    <h2 class="text-white font-bold text-base md:text-lg leading-snug flex-1 min-w-0 break-words">
                        <a href="${module.mainLink}" target="_blank" class="hover:underline block">
                            ${module.title}
                        </a>
                    </h2>
                    <span class="bg-white/20 text-white text-[10px] px-2 py-1 rounded-full backdrop-blur-sm whitespace-nowrap flex-shrink-0">
                        ${module.units.length} Units
                    </span>
                </div>
            </div>
            <div class="flex-grow">
                <ul class="divide-y divide-slate-50">
                    ${unitsHtml}
                </ul>
            </div>
            <div class="bg-slate-50 p-3 border-t border-slate-100 mt-auto">
                <a href="${module.mainLink}" target="_blank" class="text-xs font-semibold text-blue-600 hover:text-blue-800 flex items-center justify-center gap-1 uppercase tracking-wider">
                        查看模組章節 <i class="fas fa-external-link-alt text-[10px]"></i>
                    </a>
                </div>
            `;
            moduleGrid.appendChild(card);
        });

        if (filtered.length === 0) {
            moduleGrid.innerHTML = `
                <div class="col-span-full py-20 text-center">
                    <div class="text-slate-300 text-6xl mb-4"><i class="fas fa-ghost"></i></div>
                    <p class="text-slate-500">找不到相符的課程或單元...</p>
                </div>
            `;
        }
    }

    searchInput.addEventListener('input', (e) => {
        renderModules(e.target.value);
    });

    // Back to top functionality
    const backToTopBtn = document.getElementById('backToTopBtn');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            backToTopBtn.classList.remove('opacity-0', 'invisible');
            backToTopBtn.classList.add('opacity-100', 'visible');
        } else {
            backToTopBtn.classList.remove('opacity-100', 'visible');
            backToTopBtn.classList.add('opacity-0', 'invisible');
        }
    });
    
    backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Initial render
    renderModules();
</script>

</body>
</html>
